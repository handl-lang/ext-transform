[package]
name = "hnl-ext-transform"
version = "0.1.0"
edition = "2024"
description = "`hnl transform` — the transform runner as a dynamic `hnl` extension (ADR-0149)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-transform"
homepage = "https://handl-lang.github.io/docs/ext-transform/"
documentation = "https://handl-lang.github.io/docs/ext-transform/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-transform (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_transform.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-tool-fmt = { git = "https://github.com/handl-lang/tool-fmt", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-tool-transform = { git = "https://github.com/handl-lang/tool-transform", branch = "main" }
hnl-tool-transform-rewrite = { git = "https://github.com/handl-lang/tool-transform-rewrite", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1

# T-124–T-126: the folded kit crates resolve from the sibling `../host`
# checkout — several vendor `../../../lib-*` packages in build.rs, which
# a bare git checkout cannot see.
[patch."https://github.com/handl-lang/host"]
handl-kit-core = { path = "../host/crates/handl-kit-core" }
handl-kit-prelude = { path = "../host/crates/kit-prelude" }
handl-kit-data-prelude = { path = "../host/crates/handl-kit-data-prelude" }
handl-kit-prelude-lang = { path = "../host/crates/handl-kit-prelude-lang" }
handl-kit-stdlib = { path = "../host/crates/handl-kit-stdlib" }
handl-kit-server = { path = "../host/crates/handl-kit-server" }
handl-kit-ffi = { path = "../host/crates/handl-kit-ffi" }
handl-plugin-ffi = { path = "../host/crates/plugin-ffi" }
handl-kit-lang = { path = "../host/crates/handl-kit-lang" }
handl-kit-eqsat = { path = "../host/crates/handl-kit-eqsat" }
handl-kit-mlopt = { path = "../host/crates/kit-mlopt" }
hnl-ext-mlopt = { path = "../host/crates/hnl-ext-mlopt" }

[patch."https://github.com/handl-lang/tool-test"]
handl-kit-test = { path = "../tool-test/crates/kit-test" }
